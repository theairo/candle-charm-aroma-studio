<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог | Candle & Charm</title>
<link rel="icon" href="img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="layout.js"></script>
<script src="config.js"></script>

<main>
  <div class="wrap page-title">
    <h1>Каталог</h1>
    <p>Свічки ручної роботи для себе та в подарунок</p>
  </div>
  <section style="padding-top:32px">
    <div class="wrap">
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"><p class="state">Завантаження…</p></div>
    </div>
  </section>
</main>

<script type="module">
  import { $, esc, productCard, bindAdd, loadProducts, failedCatalog } from "./shop.js";
  const data = await loadProducts();
  if (!data) $("grid").innerHTML = failedCatalog;
  else {
    let cat = "Усі";
    const cats = ["Усі", ...new Set(data.map(c => c.category).filter(Boolean))];
    const drawFilters = () => {
      $("filters").innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip${c === cat ? " on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("") : "";
    };
    const drawGrid = () => {
      const list = data.filter(c => cat === "Усі" || c.category === cat);
      $("grid").innerHTML = list.map(productCard).join("") || '<p class="state">Тут поки порожньо</p>';
    };
    $("filters").onclick = e => {
      const b = e.target.closest(".chip"); if (!b) return;
      cat = b.dataset.cat; drawFilters(); drawGrid();
    };
    bindAdd($("grid"), data);
    drawFilters(); drawGrid();
  }
</script>
</body>
</html>
