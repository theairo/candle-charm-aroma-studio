<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Candle & Charm | студія</title>
<link rel="icon" href="img/mark.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf7f2; --card:#fff; --text:#2b2622; --muted:#8a7f75; --accent:#b5473a; --line:#ebe4da; --ok:#3d7a4f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; line-height: 1.5; }
  h1, h2 { font-family: "Cormorant Garamond", serif; font-weight: 600; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .top h1 { font-size: 34px; }
  .btn { background: var(--text); color: #fff; border: 0; padding: 10px 20px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--text); }
  .btn.ghost:hover { background: var(--text); color: #fff; }
  .btn.danger { background: none; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger:hover { background: var(--accent); color: #fff; }
  .btn.sm { padding: 5px 12px; font-size: 12px; }
  .box { background: var(--card); border: 1px solid var(--line); padding: 24px; }
  .login { max-width: 360px; margin: 80px auto; }
  .login h1 { font-size: 34px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); background: #fff; color: var(--text); }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 72px; }
  .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .msg.err { color: var(--accent); } .msg.ok { color: var(--ok); }
  .hidden { display: none !important; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 500; }
  td img { width: 44px; height: 56px; object-fit: cover; display: block; background: var(--line); }
  tr.off td { opacity: .5; }
  .act { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .tag { font-size: 11px; background: var(--line); padding: 2px 8px; border-radius: 999px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .ph { position: relative; width: 96px; }
  .ph img { width: 96px; height: 120px; object-fit: cover; display: block; background: var(--line); }
  .ph .row { display: flex; justify-content: space-between; margin-top: 4px; }
  .ph button { background: none; border: 0; font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; }
  .ph .cover { position: absolute; top: 4px; left: 4px; background: var(--accent); color: #fff; font-size: 10px; padding: 1px 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--text); }
  .check input { width: auto; }
  .formact { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .hide-s { display: none; } }
</style>
</head>
<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="box login hidden">
    <h1>Вхід</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Пароль</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <div class="formact"><button class="btn" id="loginBtn" type="submit">Увійти</button></div>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <!-- LIST -->
  <div id="listView" class="hidden">
    <div class="top">
      <h1>Товари</h1>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn ghost" href="index.html" style="text-decoration:none">Переглянути сайт</a>
        <button class="btn" id="newBtn" type="button">+ Додати товар</button>
        <button class="btn ghost" id="logoutBtn" type="button">Вийти</button>
      </div>
    </div>
    <div class="msg" id="listMsg"></div>
    <table>
      <thead><tr><th></th><th>Назва</th><th class="hide-s">Категорія</th><th>Ціна</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- FORM -->
  <div id="formView" class="hidden">
    <div class="top"><h1 id="formTitle">Товар</h1><button class="btn ghost" id="backBtn" type="button">← Назад</button></div>
    <form class="box" id="form">
      <div class="grid2">
        <div><label for="f_name">Назва *</label><input id="f_name" required maxlength="120"></div>
        <div><label for="f_price">Ціна, ₴ *</label><input id="f_price" type="number" min="0" step="1" required></div>
      </div>
      <label for="f_desc">Опис</label>
      <textarea id="f_desc" maxlength="600"></textarea>
      <label for="f_comp">Склад</label>
      <input id="f_comp" maxlength="200" placeholder="Соєвий віск, аромаолія…">
      <div class="grid2">
        <div><label for="f_weight">Вага, г</label><input id="f_weight" type="number" min="0" step="1"></div>
        <div><label for="f_cat">Категорія</label><input id="f_cat" list="cats" maxlength="60"><datalist id="cats"></datalist></div>
        <div><label for="f_sort">Порядок (менше = вище)</label><input id="f_sort" type="number" step="1" value="100"></div>
      </div>
      <label class="check"><input type="checkbox" id="f_active" checked> Показувати на сайті</label>

      <label>Фото (перше головне)</label>
      <div class="photos" id="photos"></div>
      <div style="margin-top:10px"><input id="f_file" type="file" accept="image/*" multiple></div>

      <div class="formact">
        <button class="btn" id="saveBtn" type="submit">Зберегти</button>
        <button class="btn danger" id="delBtn" type="button">Видалити товар</button>
      </div>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

  const BUCKET = "candle-images";
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const say = (id, t, cls = "") => { $(id).textContent = t; $(id).className = "msg " + cls; };
  const show = v => { for (const x of ["loginView", "listView", "formView"]) $(x).classList.toggle("hidden", x !== v); };

  let items = [];          // all candles
  let editing = null;      // row being edited, or null for a new one
  let photos = [];         // urls in the form, first = cover
  const bucketPrefix = `${window.SUPABASE_URL}/storage/v1/object/public/${BUCKET}/`;
  const bucketPath = url => url?.startsWith(bucketPrefix) ? decodeURIComponent(url.slice(bucketPrefix.length)) : null;

  // ---------- auth ----------
  async function route() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return show("loginView");
    show("listView"); await load();
  }
  $("loginForm").onsubmit = async e => {
    e.preventDefault(); $("loginBtn").disabled = true; say("loginMsg", "");
    const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
    $("loginBtn").disabled = false; $("pass").value = "";
    if (error) return say("loginMsg", "Невірний email або пароль", "err");
    route();
  };
  $("logoutBtn").onclick = async () => { await db.auth.signOut(); route(); };

  // ---------- list ----------
  async function load() {
    say("listMsg", "Завантаження…");
    const { data, error } = await db.from("candles").select("*").order("sort_order").order("id");
    if (error) return say("listMsg", "Помилка: " + error.message, "err");
    items = data;
    say("listMsg", items.length ? "" : "Товарів немає (або цей акаунт не має доступу)");
    $("rows").innerHTML = items.map(c => `
      <tr class="${c.is_active ? "" : "off"}">
        <td><img src="${esc(c.image_url)}" alt=""></td>
        <td><b>${esc(c.name)}</b>${c.is_active ? "" : ' <span class="tag">прихований</span>'}</td>
        <td class="hide-s">${esc(c.category || "-")}</td>
        <td>${Number(c.price)} ₴</td>
        <td><div class="act">
          <button class="btn ghost sm" data-a="toggle" data-id="${c.id}">${c.is_active ? "Сховати" : "Показати"}</button>
          <button class="btn sm" data-a="edit" data-id="${c.id}">Редагувати</button>
        </div></td>
      </tr>`).join("");
    $("cats").innerHTML = [...new Set(items.map(c => c.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("");
  }
  $("rows").onclick = async e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const c = items.find(x => String(x.id) === b.dataset.id); if (!c) return;
    if (b.dataset.a === "edit") return openForm(c);
    const { data, error } = await db.from("candles").update({ is_active: !c.is_active }).eq("id", c.id).select();
    if (error || !data.length) return say("listMsg", "Не вдалося зберегти (немає прав?)", "err");
    load();
  };
  $("newBtn").onclick = () => openForm(null);

  // ---------- form ----------
  function drawPhotos() {
    $("photos").innerHTML = photos.map((u, i) => `
      <div class="ph">${i === 0 ? '<span class="cover">головне</span>' : ""}
        <img src="${esc(u)}" alt="">
        <div class="row">${i ? `<button type="button" data-a="first" data-i="${i}">головне</button>` : "<span></span>"}<button type="button" data-a="del" data-i="${i}">видалити</button></div>
      </div>`).join("") || '<span style="color:var(--muted);font-size:13px">Фото ще немає</span>';
  }
  $("photos").onclick = e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const i = Number(b.dataset.i);
    if (b.dataset.a === "del") photos.splice(i, 1);
    if (b.dataset.a === "first") photos.unshift(...photos.splice(i, 1));
    drawPhotos();
  };

  function openForm(c) {
    editing = c; photos = c ? [...(c.images?.length ? c.images : [c.image_url].filter(Boolean))] : [];
    $("formTitle").textContent = c ? "Редагувати товар" : "Новий товар";
    $("f_name").value = c?.name ?? ""; $("f_price").value = c?.price ?? "";
    $("f_desc").value = c?.description ?? ""; $("f_comp").value = c?.composition ?? "";
    $("f_weight").value = c?.weight_g ?? ""; $("f_cat").value = c?.category ?? "";
    $("f_sort").value = c?.sort_order ?? (Math.max(0, ...items.map(x => x.sort_order)) + 1);
    $("f_active").checked = c ? c.is_active : true;
    $("delBtn").classList.toggle("hidden", !c);
    $("f_file").value = ""; say("formMsg", ""); drawPhotos(); show("formView");
  }
  $("backBtn").onclick = () => { show("listView"); load(); };

  // Resize in the browser (max 1200px, WebP ~85%) so photos stay small and fast.
  async function compress(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("compress")), "image/webp", 0.85));
  }

  $("f_file").onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    $("saveBtn").disabled = true;
    try {
      for (const [n, f] of files.entries()) {
        say("formMsg", `Завантаження фото ${n + 1} з ${files.length}…`);
        const blob = await compress(f);
        const path = `${crypto.randomUUID()}.webp`;
        const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType: "image/webp", cacheControl: "31536000" });
        if (error) throw error;
        photos.push(db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
        drawPhotos();
      }
      say("formMsg", "Фото додано. Не забудьте натиснути «Зберегти».", "ok");
    } catch (err) { say("formMsg", "Помилка завантаження: " + (err.message || err), "err"); }
    $("saveBtn").disabled = false; e.target.value = "";
  };

  $("form").onsubmit = async e => {
    e.preventDefault();
    if (!photos.length) return say("formMsg", "Додайте хоча б одне фото", "err");
    const row = {
      name: $("f_name").value.trim(), price: Number($("f_price").value),
      description: $("f_desc").value.trim() || null, composition: $("f_comp").value.trim() || null,
      weight_g: $("f_weight").value === "" ? null : Number($("f_weight").value),
      category: $("f_cat").value.trim() || null, sort_order: Number($("f_sort").value) || 0,
      is_active: $("f_active").checked, image_url: photos[0], images: photos,
    };
    $("saveBtn").disabled = true; say("formMsg", "Збереження…");
    const q = editing ? db.from("candles").update(row).eq("id", editing.id) : db.from("candles").insert(row);
    const { data, error } = await q.select();
    $("saveBtn").disabled = false;
    if (error || !data?.length) return say("formMsg", "Не вдалося зберегти: " + (error?.message || "немає доступу"), "err");

    // remove photos that were taken out of this product (only ones stored in our bucket)
    const gone = (editing?.images ?? []).filter(u => !photos.includes(u)).map(bucketPath).filter(Boolean);
    if (gone.length) await db.storage.from(BUCKET).remove(gone);

    say("formMsg", "Збережено ✓", "ok");
    editing = data[0]; $("delBtn").classList.remove("hidden"); $("formTitle").textContent = "Редагувати товар";
  };

  $("delBtn").onclick = async () => {
    if (!editing || !confirm(`Видалити «${editing.name}» назавжди? Це не можна скасувати.`)) return;
    const { data, error } = await db.from("candles").delete().eq("id", editing.id).select();
    if (error || !data?.length) return say("formMsg", "Не вдалося видалити", "err");
    const files = (editing.images ?? []).map(bucketPath).filter(Boolean);
    if (files.length) await db.storage.from(BUCKET).remove(files);
    show("listView"); load();
  };

  route();
</script>
</body>
</html>
